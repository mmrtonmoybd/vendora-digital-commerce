name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Code style and static analysis. No database, so it fails fast and cheaply on
  # the mistakes that do not need one.
  # ---------------------------------------------------------------------------
  static:
    name: Style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_mysql, gd, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan, level 6)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github

      - name: Template parity
        # The storefront is a slice of design/vendora. This fails if a Tailwind class was
        # invented rather than taken from the template.
        run: php scripts/check-classes.php

  # ---------------------------------------------------------------------------
  # Formatting of everything Pint does not own: Blade, CSS, JS, JSON, YAML.
  # ---------------------------------------------------------------------------
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npx prettier --check .

  # ---------------------------------------------------------------------------
  # The suite. MySQL rather than SQLite on purpose: the money guarantees rest on
  # SELECT … FOR UPDATE, which SQLite ignores, so a concurrency test passing on
  # SQLite would prove nothing about production.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vendora_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_mysql, gd, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL never became ready"; exit 1

      - name: Migrate
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: vendora_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run the suite
        run: vendor/bin/pest --colors=always
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: vendora_test
          DB_USERNAME: root
          DB_PASSWORD: root

  # ---------------------------------------------------------------------------
  # The front-end build.
  #
  # This needs composer install as well as npm: the Filament admin theme imports
  # CSS straight out of vendor/filament, so without PHP dependencies the Vite
  # build cannot resolve its own entrypoint.
  # ---------------------------------------------------------------------------
  assets:
    name: Build front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: Install PHP dependencies
        # The theme CSS imports from vendor/filament, so this is a build dependency
        # of the front-end, not just of the application.
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
